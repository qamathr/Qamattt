<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font-size:14px}</style>
<title>قامات الشهر</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Concept: a wire-bound notebook seen at an angle on a white-to-deep-teal ground. Closed, it carries the Qamat logo; opened, the cover swings away and the issue's note, heading and logo are pinned to the lined page. */
:root{
  --ink:#1D4A4E;
  --ink-deep:#143B3F;
  --teal:#72ADBB;
  --mist:#BFDDE4;
  --paper:#F9F6EE;
  --cream:#F6F2E9;
  --kraft:#EFE4CB;
  --display:'Reem Kufi','Segoe UI',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  background:linear-gradient(180deg,#FFFFFF 0%,#E9F0F1 22%,#C3D2D5 50%,#8FA7AC 76%,#587277 100%);
  color:var(--ink);
  font-family:var(--body);
  display:grid;
  place-items:center;
  overflow-x:hidden;
  padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;
}
.scene{display:flex;flex-direction:column;align-items:center;gap:20px;perspective:1800px;max-width:100%}
.book{
  font-size:calc(min(88vw,600px,54vh)/62);
  position:relative;width:62em;height:86em;
  transform-style:preserve-3d;
  transform:rotateX(9deg) rotateY(-5deg) rotateZ(-3deg);
  transition:transform 1.2s cubic-bezier(.4,.1,.2,1);
}
.book.open{transform:rotateX(5deg) rotateY(-2deg) rotateZ(-1.5deg)}
.book__back{position:absolute;left:-.8em;top:-1.2em;width:63.6em;height:89em;border-radius:2em;background:linear-gradient(180deg,var(--ink),var(--ink-deep));transform:translateZ(-1.4em);box-shadow:0 5em 7em -2em rgba(14,40,45,.5)}
.book__stack{position:absolute;inset:0;border-radius:1em 1.4em 1.4em 1em;background:#EFEADC;box-shadow:0 .6em 0 -.1em #E2DCCB,0 1.1em 0 -.2em #F6F2E8,0 1.6em 0 -.3em #D9D2BF,0 2.1em 0 -.4em #EDE8DA}
.book__page{position:absolute;inset:0;border-radius:1em 1.4em 1.4em 1em;background:
  linear-gradient(90deg,rgba(29,74,78,.14) 0,rgba(0,0,0,0) 8%),
  repeating-linear-gradient(180deg,rgba(0,0,0,0) 0 4.7em,rgba(111,174,189,.5) 4.7em 4.9em) 0 3em/100% 100% no-repeat,
  var(--paper)}
.book__page::before{content:"";position:absolute;left:9.6em;top:0;bottom:0;border-left:.2em solid rgba(111,174,189,.55)}
.holes{position:absolute;left:0;top:2.4em;width:6em;height:81.2em}
.coils{position:absolute;left:-4em;top:2.4em;width:9em;height:81.2em;transform:translateZ(2.6em);filter:drop-shadow(.5em .7em .4em rgba(14,40,45,.4))}

.sheet{position:absolute;left:12em;top:5em;width:46em;display:flex;flex-direction:column;gap:4em;transform:translateZ(.8em)}
.sheet>*{opacity:0;transform:translateY(2.4em);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.book.open .sheet>*{opacity:1}
.book.open .sheet>.note{transform:rotate(1.2deg);transition-delay:.7s}
.book.open .sheet>.strip{transform:rotate(-1deg);transition-delay:1s}
.book.open .sheet>.tag{transform:rotate(2deg);transition-delay:1.3s}

.note{position:relative;filter:drop-shadow(0 1.4em 1.2em rgba(29,74,78,.35))}
.note__paper{padding:4.6em 3.8em 5em;background:linear-gradient(170deg,#F6EEDB,#EADFC6);clip-path:polygon(0 0,100% 0,100% 97.5%,94% 99%,88% 97%,82% 99%,76% 97.5%,70% 99%,64% 97%,58% 98.8%,52% 97.5%,46% 99%,40% 97%,34% 98.8%,28% 97.5%,22% 99%,16% 97%,10% 98.8%,5% 97.5%,0 98.8%)}
.note p{margin:0;font-size:2.7em;line-height:1.85;font-weight:500;text-wrap:pretty}
.clip{position:absolute;left:4em;top:-3.6em;width:3.4em;height:11em;filter:drop-shadow(.4em .6em .3em rgba(14,40,45,.4))}
.pin{position:absolute;width:3.2em;height:3.2em;border-radius:50%;box-shadow:.6em .9em .9em rgba(14,40,45,.4),inset -.2em -.3em .4em rgba(0,0,0,.25)}
.pin--teal{background:radial-gradient(circle at 35% 30%,#BFE3EA,#5B9FAD 50%,var(--ink) 100%)}
.pin--cream{background:radial-gradient(circle at 35% 30%,#F6F2E9,#D8CCB0 55%,#A89B7C 100%)}

.strip{position:relative;padding:2.2em 3em;text-align:center;background:linear-gradient(170deg,#D6EAEF,#C2DEE5);box-shadow:0 1.4em 1.6em -.8em rgba(29,74,78,.4)}
.strip h2{margin:0;font-family:var(--display);font-weight:700;font-size:6.6em;line-height:1.25;color:var(--ink);text-wrap:balance}
.tape{position:absolute;width:9em;height:3em;background:repeating-linear-gradient(135deg,rgba(246,242,233,.92) 0 .9em,rgba(226,219,200,.92) .9em 1.8em)}
.strip .tape:nth-of-type(1){left:-2em;top:-1.2em;transform:rotate(-32deg)}
.strip .tape:nth-of-type(2){right:-2em;bottom:-1.2em;transform:rotate(-32deg)}

.tag{position:relative;align-self:center;width:24em;padding:3em 2em 2.4em;display:flex;justify-content:center;background:linear-gradient(170deg,#FFFDF8,#F3EEE1);box-shadow:0 1.4em 1.6em -.8em rgba(29,74,78,.4)}
.tag img{display:block;height:10.5em;width:auto}
.tag .pin{left:50%;top:-1.2em;margin-left:-1.6em}
.spark{position:absolute;width:3em;height:3em;transform:translateZ(.5em);fill:var(--teal)}

.cover{
  position:absolute;inset:0;padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer;
  transform-origin:left center;transform-style:preserve-3d;
  transform:translateZ(2em);
  transition:transform 1.4s cubic-bezier(.5,.05,.2,1),opacity .5s ease .9s,visibility 0s linear 1.5s;
}
.book.open .cover{transform:translateZ(2em) rotateY(-130deg);opacity:0;visibility:hidden;pointer-events:none}
.cover:focus-visible{outline:.3em solid var(--teal);outline-offset:.6em;border-radius:1.6em}
.cover__front,.cover__inner{position:absolute;inset:0;border-radius:1em 1.6em 1.6em 1em;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cover__front{background:radial-gradient(rgba(255,255,255,.05) .1em,transparent .14em) 0 0/.8em .8em,linear-gradient(160deg,#245A60,var(--ink) 45%,var(--ink-deep));box-shadow:inset 0 0 0 .3em rgba(0,0,0,.18),inset .6em 0 1.4em rgba(0,0,0,.25)}
.cover__inner{transform:rotateY(180deg);background:#17393D}
.cover__frame{position:absolute;top:3.4em;bottom:3.4em;left:10em;right:3.6em;border:.15em solid rgba(246,242,233,.4);border-radius:1.2em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2em;padding:2em}
.cover__frame img{display:block;height:25em;width:auto}
.cover__title{font-family:var(--display);font-weight:700;font-size:8.6em;line-height:1.15;color:var(--cream);text-align:center}
.cover__hint{font-size:2.4em;font-weight:500;color:var(--cream);border:.1em solid rgba(246,242,233,.7);border-radius:99em;padding:.45em 1.4em;animation:nudge 2.4s ease-in-out infinite}
.band{position:absolute;top:0;bottom:0;right:1em;width:1.6em;background:linear-gradient(90deg,#0F3236,#26595F,#0F3236);box-shadow:0 0 .6em rgba(0,0,0,.3)}
@keyframes nudge{0%,100%{opacity:.75;transform:translateY(0)}50%{opacity:1;transform:translateY(-.25em)}}

.close{font:500 15px/1 var(--body);color:var(--cream);background:rgba(20,59,63,.88);border:0;border-radius:99px;padding:12px 22px;cursor:pointer}
.close:hover{background:var(--ink-deep)}
.close:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.close[hidden]{display:none}

@media (prefers-reduced-motion:reduce){
  .book,.cover,.sheet>*{transition-duration:.01ms!important;transition-delay:0s!important}
  .cover__hint{animation:none}
}
</style>

</head>

<main class="scene" lang="ar" dir="rtl">
<div class="book" id="book">
  <div class="book__back"></div>
  <div class="book__stack"></div>
  <div class="book__page"></div>

  <svg class="holes" aria-hidden="true" viewBox="0 0 60 812"><defs><pattern id="holes" width="60" height="58" patternUnits="userSpaceOnUse"><circle cx="30" cy="29" r="9" fill="#CBC4B1"></circle><circle cx="30" cy="30" r="7" fill="#9E9884"></circle></pattern></defs><rect width="60" height="812" fill="url(#holes)"></rect></svg>

<script>
(function(){
  var book=document.getElementById('book'),cover=document.getElementById('cover'),sheet=document.getElementById('sheet'),closeBtn=document.getElementById('close');
  function setOpen(o){
    book.classList.toggle('open',o);
    sheet.setAttribute('aria-hidden',o?'false':'true');
    cover.setAttribute('aria-expanded',o?'true':'false');
    closeBtn.hidden=!o;
    if(o){closeBtn.focus({preventScroll:true})}else{cover.focus({preventScroll:true})}
  }
  cover.addEventListener('click',function(){setOpen(true)});
  closeBtn.addEventListener('click',function(){setOpen(false)});
})();
</script>
